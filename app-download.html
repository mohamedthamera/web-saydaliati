<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحميل تطبيق صيدليتي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #4A8DFF, #6C63FF);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 1.5rem;
    }
    .card { max-width: 380px; width: 100%; }
    .spinner {
      width: 48px; height: 48px;
      margin: 0 auto 1.5rem;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; margin-bottom: .5rem; }
    p { opacity: .9; margin-bottom: .25rem; }
    .store {
      display: inline-flex; align-items: center; gap: 1rem;
      margin-top: 1.5rem; padding: .75rem 1.25rem;
      background: #fff; color: #1A1A2E;
      border-radius: 14px; text-decoration: none;
      font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>جاري تحويلك إلى المتجر المناسب…</h1>
    <p>إذا لم يتم التحويل تلقائياً، اضغط على الزر أدناه.</p>
    <a class="store" id="manualLink" href="https://play.google.com/store/apps/details?id=com.saydaliati.saydaliati">
      تحميل التطبيق
    </a>
  </div>

  <script>
    (function () {
      var APP_STORE_URL = "https://apps.apple.com/us/app/%D8%B5%D9%8A%D8%AF%D9%84%D9%8A%D8%AA%D9%8A-saydalati/id6796813694?l=ar";
      var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.saydaliati.saydaliati";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var target;
      if (isIOS) target = APP_STORE_URL;
      else if (isAndroid) target = PLAY_STORE_URL;
      else target = PLAY_STORE_URL;

      var manual = document.getElementById("manualLink");
      manual.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
